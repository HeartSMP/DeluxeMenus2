name: Release jar

# Every push builds the plugin and publishes the jar in the Releases tab.
# Each branch gets one rolling pre-release (tag "latest-<branch>") that is replaced on every push.
on:
  push:
    branches: [ "main", "dynamic-slot2" ]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Build
      run: ./gradlew shadowJar
      env:
        BUILD_NUMBER: '${{ github.run_number }}-${{ github.sha }}'

    - name: Publish rolling release
      env:
        GH_TOKEN: ${{ github.token }}
        BRANCH: ${{ github.ref_name }}
      run: |
        TAG="latest-${BRANCH//\//-}"
        gh release delete "$TAG" --cleanup-tag --yes || true
        gh release create "$TAG" build/libs/DeluxeMenus-*.jar \
          --target "$GITHUB_SHA" \
          --title "DeluxeMenus ($BRANCH) build ${{ github.run_number }}" \
          --notes "Automatic build of commit $GITHUB_SHA on branch $BRANCH." \
          --prerelease
